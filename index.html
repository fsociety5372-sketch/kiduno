<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Сканер Wi-Fi | MR.CHAT</title>
    <!-- Скрипт для интеграции с Telegram -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            background-color: #17212b; /* Темный фон Телеграма */
            color: white;
            font-family: 'Segoe UI', sans-serif;
            text-align: center;
            padding: 20px;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 { color: #2AABEE; margin-top: 20px; }
        .card {
            background-color: #232e3c;
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 20px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
            box-sizing: border-box;
        }
        .btn {
            background-color: #2AABEE;
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 12px;
            font-size: 18px;
            font-weight: bold;
            width: 100%;
            cursor: pointer;
            transition: 0.2s;
        }
        .btn:active { background-color: #1e8cc2; transform: scale(0.98); }
        
        #loading {
            color: #ffcc00;
            font-weight: bold;
            display: none;
            margin-top: 15px;
        }
        #resultCard {
            display: none; 
            text-align: left;
        }
        .device-item {
            background: #17212b;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 10px;
            font-family: monospace;
            font-size: 14px;
            border-left: 4px solid #2AABEE;
        }
        .error-text { color: #ff5555; font-weight: bold; }
    </style>
</head>
<body>

    <h1>📡 Сканер Сети</h1>
    
    <div class="card">
        <p>Нажми кнопку, чтобы узнать, кто подключен к твоему Wi-Fi.</p>
        <button class="btn" onclick="scan()">Сканировать</button>
        <div id="loading">⏳ Сканирую... Подожди 10 секунд.</div>
    </div>

    <div class="card" id="resultCard">
        <h3 style="margin-top: 0; color: white;">Результаты:</h3>
        <div id="result"></div>
    </div>

    <script>
        // =========================================================
        // ⚠️ СЮДА ВСТАВЬ СВОЮ ССЫЛКУ ОТ CLOUDFLARE (без /scan на конце!)
        // =========================================================
        const TUNNEL_URL = "https://sie-deaf-days-describe.trycloudflare.com"; 
        // =========================================================

        async function scan() {
            // Показываем загрузку
            document.getElementById('loading').style.display = 'block';
            document.getElementById('resultCard').style.display = 'none';
            
            try {
                // Стучимся к нашему Python-серверу в Termux
                const response = await fetch(TUNNEL_URL + '/scan');
                
                if (!response.ok) {
                    throw new Error("Сервер не отвечает");
                }

                const data = await response.json();
                
                // Прячем загрузку, показываем результат
                document.getElementById('loading').style.display = 'none';
                document.getElementById('resultCard').style.display = 'block';
                
                let html = `<p>Твой IP: <b>${data.my_ip}</b></p>`;
                html += `<p>Найдено устройств: <b>${data.devices.length}</b></p>`;
                
                if (data.devices.length === 0) {
                    html += "<p style='color:#ffcc00'>В сети пока никого нет, кроме тебя.</p>";
                } else {
                    data.devices.forEach(dev => {
                        html += `<div class="device-item">
                            <b>IP:</b> ${dev.ip}<br>
                            <b>MAC:</b> ${dev.mac}
                        </div>`;
                    });
                }
                
                document.getElementById('result').innerHTML = html;

            } catch (error) {
                // Если ошибка (например, Termux закрылся)
                document.getElementById('loading').style.display = 'none';
                document.getElementById('resultCard').style.display = 'block';
                document.getElementById('result').innerHTML = `
                    <p class="error-text">Ошибка связи с сервером.</p>
                    <p>Проверь, что Termux открыт, сервер запущен, и ссылка вставлена правильно.</p>
                `;
            }
        }
    </script>
</body>
</html>
