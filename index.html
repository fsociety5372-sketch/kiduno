<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>kiduno | Download</title>
    <style>
        /* Сброс стилей */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* Черный фон и зеленый текст */
        body {
            background-color: #050505; /* Глубокий черный */
            color: #00ff00; /* Неоновый зеленый */
            font-family: 'Courier New', Courier, monospace; /* Хакерский шрифт */
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            text-align: center;
            overflow: hidden;
        }

        /* Эффект свечения для заголовка */
        h1 {
            font-size: 50px;
            text-transform: uppercase;
            letter-spacing: 4px;
            margin-bottom: 10px;
            text-shadow: 0 0 10px #00ff00, 0 0 20px #00ff00;
            animation: glow 2s ease-in-out infinite alternate;
        }

        @keyframes glow {
            from { text-shadow: 0 0 10px #00ff00, 0 0 20px #00ff00; }
            to { text-shadow: 0 0 15px #00ff00, 0 0 30px #00ff00, 0 0 40px #00ff00; }
        }

        p {
            color: #008800; /* Темно-зеленый для подписи */
            margin-bottom: 40px;
            font-size: 16px;
        }

        /* Стильная кнопка скачивания */
        .download-btn {
            display: inline-block;
            padding: 15px 40px;
            font-size: 20px;
            font-family: inherit;
            font-weight: bold;
            color: #00ff00;
            background-color: transparent;
            border: 2px solid #00ff00;
            border-radius: 5px;
            cursor: pointer;
            text-decoration: none;
            text-transform: uppercase;
            transition: all 0.3s ease;
            box-shadow: 0 0 10px rgba(0, 255, 0, 0.2);
        }

        /* Эффект при наведении и нажатии */
        .download-btn:hover {
            background-color: #00ff00;
            color: #000000;
            box-shadow: 0 0 20px rgba(0, 255, 0, 0.6);
        }

        .download-btn:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body>

    <h1>kiduno</h1>
    <p>Secure connection established.</p>

    <!-- Кнопка скачивания. В href укажи имя файла, который загрузишь на GitHub -->
    <a href="app.apk" download class="download-btn">Скачать</a>

</body>
</html>
